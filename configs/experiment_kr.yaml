# 국내 주식 실험. 먼저 `pip install finance-datareader` 필요.
# 실행: python -m quant check-data                              # 어떤 소스가 되는지 진단
#       python -m quant fetch    -c configs/experiment_kr.yaml  # 시세 수집·캐시
#       python -m quant optimize -c configs/experiment_kr.yaml
#
# source 는 fdr(권장, 무인증) / naver(무의존) / krx(pykrx) 중 선택.
# 자세한 비교는 docs/DATA_SOURCES.md 참조. 모두 무료다.

data:
  source: fdr
  symbols:
    - "005930"   # 삼성전자
    - "000660"   # SK하이닉스
    - "005380"   # 현대차
    - "035420"   # NAVER
    - "035720"   # 카카오
    - "051910"   # LG화학
    - "005490"   # POSCO홀딩스
    - "068270"   # 셀트리온
    - "105560"   # KB금융
    - "012330"   # 현대모비스
  start: "2015-01-01"
  end: "2025-12-31"
  cache_dir: data/cache
  min_bars: 250

backtest:
  initial_cash: 10000000
  cost: kr                 # 수수료 0.015%/편도 + 거래세 0.18%(매도) + 슬리피지 0.05%
  execution: next_open
  signal_lag: 1
  allow_short: false       # 국내 개인 공매도 제약 반영
  max_weight: 1.0
  rebalance_threshold: 0.05
  allow_fractional: false  # 국내는 정수 주 단위
  stop_loss_pct: 0.10
  trailing_stop_pct: 0.0
  max_holding_days: 0
  trading_days: 246        # 국내 연평균 거래일
  risk_free_rate: 0.03

optimize:
  objective: robust
  min_trades: 20
  output_dir: reports/kr
  store_equity_top: 8
  strategies:
    - buy_and_hold
    - sma_cross
    - macd
    - donchian
    - momentum
    - rsi_reversion
    - bollinger
    - zscore
    - vol_target

validate:
  split_date: "2022-01-01"
  top_n: 5
  train_days: 492
  test_days: 123
