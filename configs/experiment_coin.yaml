# 월 10만원 적립 · 코인 소액 자동매매 실험
#
#   python -m quant check-data --source upbit --symbol KRW-BTC
#   python -m quant fetch    -c configs/experiment_coin.yaml
#   python -m quant optimize -c configs/experiment_coin.yaml
#   python -m quant validate -c configs/experiment_coin.yaml
#
# 소액에서 코인을 쓰는 이유는 "코인이 더 오른다"가 아니라 구조 때문이다.
#   · 소수점 매매  -> 10만원으로도 분산 가능 (주식은 1주 단위라 1종목도 빠듯)
#   · 왕복 20bp    -> 국내주식 31bp 대비 2/3, 증권거래세 없음
#   · 최소주문 5천원
# 대신 변동성이 주식의 2~3배다. MDD 를 반드시 확인할 것.

data:
  source: upbit          # 업비트 공개 API, 인증 불필요
  symbols:
    - "KRW-BTC"
    - "KRW-ETH"
    - "KRW-XRP"
    - "KRW-SOL"
    - "KRW-ADA"
  start: "-5y"
  end: "today"
  cache_dir: data/cache
  min_bars: 250

backtest:
  # 첫 달 10만원으로 시작해 매월 10만원씩 추가 입금
  initial_cash: 100000
  contribution: 100000
  contribution_freq: M
  min_order_value: 5000    # 업비트 최소 주문금액. 미만 주문은 생략된다

  cost: upbit              # 수수료 0.05%/편도 + 슬리피지 0.05% = 왕복 약 20bp
  execution: next_open
  signal_lag: 1
  allow_short: false
  allow_fractional: true   # 코인은 소수점 매매 가능 — 소액의 핵심
  max_weight: 1.0
  rebalance_threshold: 0.10   # 소액에서는 임계치를 크게 잡아 잔거래를 막는다

  stop_loss_pct: 0.0       # 그리드/적립식과 손절은 궁합이 나쁘다 (하단에서 털림)
  trailing_stop_pct: 0.0

  trading_days: 365        # 코인은 연중무휴
  risk_free_rate: 0.03

optimize:
  objective: robust
  min_trades: 10
  output_dir: reports/coin
  store_equity_top: 8
  strategies:
    - buy_and_hold         # 적립 설정과 합쳐지면 곧 '적립식 매수(DCA)' 벤치마크
    - grid                 # "자주 조금씩"의 정석
    - vol_target
    - sma_cross
    - momentum
    - bollinger
    - zscore

validate:
  split_ratio: 0.65
  top_n: 5
  train_days: 540
  test_days: 180
