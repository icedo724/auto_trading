# 월 10만원 적립 · 코인 소액 자동매매 실험
#
#   python -m quant check-data --source upbit --symbol KRW-BTC
#   python -m quant fetch    -c configs/experiment_coin.yaml
#   python -m quant optimize -c configs/experiment_coin.yaml
#   python -m quant validate -c configs/experiment_coin.yaml
#
# 소액에서 코인을 쓰는 이유는 "코인이 더 오른다"가 아니라 구조 때문이다.
#   · 소수점 매매  -> 10만원으로도 분산 가능 (주식은 1주 단위라 1종목도 빠듯)
#   · 왕복 20bp    -> 국내주식 31bp 대비 2/3, 증권거래세 없음
#   · 최소주문 5천원
# 대신 변동성이 주식의 2~3배다. MDD 를 반드시 확인할 것.

data:
  source: upbit          # 업비트 공개 API, 인증 불필요
  symbols:
    - "KRW-BTC"
    - "KRW-ETH"
    - "KRW-XRP"
    - "KRW-SOL"
    - "KRW-ADA"
  start: "-5y"
  end: "today"
  cache_dir: data/cache
  min_bars: 250

backtest:
  # 첫 달 10만원으로 시작해 매월 10만원씩 추가 입금
  initial_cash: 100000
  contribution: 100000
  contribution_freq: M
  min_order_value: 5000    # 업비트 최소 주문금액. 미만 주문은 생략된다

  cost: upbit              # 수수료 0.05%/편도 + 슬리피지 0.05% = 왕복 약 20bp
  execution: next_open
  signal_lag: 1
  allow_short: false
  allow_fractional: true   # 코인은 소수점 매매 가능 — 소액의 핵심
  max_weight: 1.0
  rebalance_threshold: 0.10   # 소액에서는 임계치를 크게 잡아 잔거래를 막는다

  stop_loss_pct: 0.0       # 그리드/적립식과 손절은 궁합이 나쁘다 (하단에서 털림)
  trailing_stop_pct: 0.0

  # 계좌 전체 손실 한도 — 종목별 손절만으로는 계좌를 못 지킨다.
  # 10종목이 각각 9%씩 빠지면(손절선 10% 미달) 계좌는 -9%인데 아무것도 발동 안 한다.
  #
  # ⚠️ 공짜가 아니다. 회복했을 손실을 확정 손실로 바꾼다.
  #    scripts/risk_limit_experiment.py 로 대가를 직접 확인할 것.
  #    한도는 반드시 **백테스트 MDD 보다 넉넉하게** 잡는다.
  risk:
    max_loss: 0.25         # 원금 대비 -25% -> 영구 정지. 이것이 진짜 '바닥'
    max_drawdown: 0.0      # 고점 대비 (쿨다운과 함께 쓰면 누적은 보장 안 됨)
    daily_loss: 0.0        # 하루 손실 (플래시 크래시 대응)
    action: halt           # halt=영구정지 / cooldown=일정기간 후 재개
    cooldown_days: 20

  trading_days: 365        # 코인은 연중무휴
  risk_free_rate: 0.03

optimize:
  objective: robust
  min_trades: 10
  output_dir: reports/coin
  store_equity_top: 8
  strategies:
    - buy_and_hold         # 적립 설정과 합쳐지면 곧 '적립식 매수(DCA)' 벤치마크
    - grid                 # "자주 조금씩"의 정석
    - vol_target
    - sma_cross
    - momentum
    - bollinger
    - zscore

validate:
  split_ratio: 0.65
  top_n: 5
  train_days: 540
  test_days: 180
